<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macro</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/ace.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/mode-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/theme/tomorrow_night.min.js"></script>
<script type="importmap">{"imports":{"zod":"https://cdn.jsdelivr.net/npm/zod@3.23.8/+esm"}}</script>
</head>
<body class="bg-zinc-900 text-zinc-100 antialiased min-h-screen">
<main class="max-w-2xl mx-auto p-4 space-y-4">
  <header class="flex justify-between gap-2"><h1 class="text-lg font-semibold">MacroPassthrough</h1><a href="/docs/profile-schema" class="text-sm text-blue-400 hover:underline">Schema</a></header>
  <div class="flex flex-wrap gap-2">
    <button type="button" id="btn-toggle" class="px-4 py-2 rounded-md text-sm font-medium bg-zinc-600">Macros OFF</button>
    <button type="button" id="btn-reload" class="px-4 py-2 rounded-md text-sm bg-zinc-700 hover:bg-zinc-600">Reload</button>
    <button type="button" id="btn-upload" class="px-4 py-2 rounded-md text-sm bg-blue-600 hover:bg-blue-500 text-white">Upload</button>
  </div>
  <section id="weapons-section" class="hidden space-y-2"><p class="text-sm text-zinc-500">Weapons</p><div id="weapon-bar" class="flex flex-wrap gap-2"></div></section>
  <section class="text-sm space-y-1 border border-zinc-700 rounded-lg p-3 bg-zinc-800/50">
    <p><span class="text-zinc-500">Macro:</span> <span id="v-profile" class="font-medium">—</span></p>
    <p><span class="text-zinc-500">Gun:</span> <span id="v-gun" class="font-medium">—</span></p>
    <p><span class="text-zinc-500">Status:</span> <span id="v-status">—</span></p>
    <p id="v-conn" class="text-xs text-zinc-500 pt-1">Connecting…</p>
  </section>
  <div id="profile-json" class="w-full h-72 rounded-md border border-zinc-700 overflow-hidden"></div>
  <p id="msg" class="text-xs text-zinc-500"></p>
</main>
<script type="module">
import { z } from 'zod';
const L = { W: 4, M: 10, S: 100, B: 131072 }, $ = (id) => document.getElementById(id);
const bad = new Set(['mouseTo', 'interp', 'segments', 'humanize']);
const step = z.object({ us: z.number().nonnegative(), mouse: z.record(z.unknown()).optional(), kbd: z.record(z.unknown()).optional() }).passthrough()
  .refine((s) => !Object.keys(s).some((k) => bad.has(k)), { message: 'removed step field' });
const mode = z.object({ comment: z.string().optional(), name: z.string().optional(), steps: z.array(step).min(1).max(L.S), n: z.number().int().positive().max(L.S).optional(), press: z.record(z.unknown()).optional(), loop: z.boolean().optional(), pressMode: z.enum(['chord', 'exact']).optional(), triggerMode: z.enum(['hold', 'tap']).optional(), modeScale: z.number().positive().optional(), scale: z.number().positive().optional() }).passthrough()
  .superRefine((m, c) => { const n = m.n ?? m.steps.length; if (n > m.steps.length) c.addIssue({ code: 'custom', message: `n=${n} > ${m.steps.length}`, path: ['n'] }); });
const bank = z.object({ name: z.string().optional(), modes: z.array(mode).max(L.M).optional(), groups: z.array(mode).max(L.M).optional() }).passthrough()
  .superRefine((w, c) => { if (!(w.modes ?? w.groups)?.length) c.addIssue({ code: 'custom', message: 'modes/groups required' }); });
const schema = z.object({ v: z.union([z.literal(1), z.literal(2), z.literal(3)]), name: z.string().optional(), groups: z.array(mode).min(1).max(L.M).optional(), scripts: z.array(bank).max(L.W).optional(), weapons: z.array(bank).max(L.W).optional(), activeScript: z.number().int().nonnegative().optional(), activeWeapon: z.number().int().nonnegative().optional() }).passthrough()
  .superRefine((p, c) => { if (p.v === 1) { if (!p.groups?.length) c.addIssue({ code: 'custom', message: 'v1 needs groups[]' }); return; } const n = (p.weapons ?? p.scripts)?.length ?? 0; if (!n) c.addIssue({ code: 'custom', message: 'weapons/scripts required' }); else if (n > L.W) c.addIssue({ code: 'custom', message: `max ${L.W} weapons` }); });
const parse = (t) => { let raw; try { raw = JSON.parse(t); } catch (e) { return { ok: 0, e: e.message }; } const r = schema.safeParse(raw); return r.success ? { ok: 1, d: r.data, raw } : { ok: 0, e: r.error.issues.map((i) => (i.path.length ? i.path.join('.') + ': ' : '') + i.message).join('; ') }; };
const minify = (d) => JSON.stringify(d);
const pad = (n) => '  '.repeat(n);
const pretty = (v, i = 0) => {
  if (v === null) return 'null';
  if (typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return v.length ? '[\n' + v.map((x) => pad(i + 1) + pretty(x, i + 1)).join(',\n') + '\n' + pad(i) + ']' : '[]';
  const ks = Object.keys(v).sort((a, b) => (a === 'comment' ? -1 : b === 'comment' ? 1 : 0));
  if (!ks.length) return '{}';
  return '{\n' + ks.map((k) => {
    const val = v[k];
    if (k === 'steps' && Array.isArray(val)) {
      return pad(i + 1) + '"steps": [\n' + val.map((s) => pad(i + 1) + JSON.stringify(s)).join(',\n') + '\n' + pad(i + 1) + ']';
    }
    return pad(i + 1) + JSON.stringify(k) + ': ' + pretty(val, i + 1);
  }).join(',\n') + '\n' + pad(i) + '}';
};
const guns = (p) => p.v !== 1 ? (p.weapons ?? p.scripts ?? []).map((w, i) => ({ i, n: w.name || `w${i}` })) : [{ i: 0, n: p.name || 'profile' }];
let q = Promise.resolve(), ws, wsT, loaded, busy, W = [], aw = 0, maxB = L.B;
const ed = ace.edit('profile-json'); ed.setTheme('ace/theme/tomorrow_night'); ed.session.setMode('ace/mode/json'); ed.session.setUseWorker(false); ed.setOptions({ fontSize: 12, showPrintMargin: false, tabSize: 2, useSoftTabs: true });
const msg = (t, ok) => { $('msg').textContent = t || ''; $('msg').className = ok ? 'text-xs text-green-400' : t ? 'text-xs text-amber-400' : 'text-xs text-zinc-500'; };
const fq = (u, o = {}) => { const p = q.then(async () => { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 12000); try { return await fetch(u, { cache: 'no-store', signal: ac.signal, ...o }); } finally { clearTimeout(tm); } }); q = p.catch(() => {}); return p; };
const err = async (r, fb) => { try { const j = await r.json(); if (j.error) return j.error; } catch (_) {} return fb; };
const conn = (ok, t) => { $('v-conn').textContent = t; $('v-conn').className = (ok ? 'text-green-400' : 'text-amber-400') + ' text-xs pt-1'; };
const drawG = () => { const b = $('weapon-bar'), on = 'px-3 py-1.5 rounded-md text-sm font-medium text-white bg-green-600 hover:bg-green-500 disabled:opacity-60', off = 'px-3 py-1.5 rounded-md text-sm font-medium text-zinc-200 bg-zinc-700 hover:bg-zinc-600 disabled:opacity-60'; b.replaceChildren(); $('weapons-section').classList.toggle('hidden', W.length <= 1); W.forEach((w) => { const e = document.createElement('button'); e.type = 'button'; e.textContent = w.n; e.disabled = busy; e.className = w.i === aw ? on : off; e.onclick = () => pick(w.i); b.appendChild(e); }); };
const setP = (p) => { W = guns(p); aw = p.activeWeapon ?? p.activeScript ?? 0; drawG(); };
const setS = (j) => { $('v-profile').textContent = j.profile || '—'; $('v-gun').textContent = j.activeWeaponName || j.activeScriptName || '—'; if (typeof j.activeWeapon === 'number') aw = j.activeWeapon; else if (typeof j.activeScript === 'number') aw = j.activeScript; if (j.profileMaxBytes > 0) maxB = j.profileMaxBytes; const ns = j.weaponNames || j.scriptNames; if (ns?.length > 1) W = ns.map((n, i) => ({ i, n: n || `w${i}` })); drawG(); const on = !!j.macrosOn; $('btn-toggle').textContent = on ? 'Macros ON' : 'Macros OFF'; $('btn-toggle').className = `px-4 py-2 rounded-md text-sm font-medium text-white ${on ? 'bg-green-600 hover:bg-green-500' : 'bg-zinc-600 hover:bg-zinc-500'}`; $('v-status').textContent = on ? 'Macros enabled' : 'Macros disabled'; $('v-status').className = on ? 'text-green-400 font-medium' : 'text-red-400 font-medium'; };
const wsOn = () => { if (ws?.readyState === 1 || ws?.readyState === 0) return; ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`); ws.onopen = () => conn(1, 'Live (WebSocket)'); ws.onmessage = (ev) => { try { setS(JSON.parse(ev.data)); conn(1, 'Live (WebSocket)'); } catch (_) {} }; ws.onclose = () => { ws = null; if (!wsT) wsT = setTimeout(() => { wsT = null; wsOn(); }, 3000); if (loaded) conn(0, 'WS offline — Reload'); }; };
async function pick(i) { if (busy || i === aw) return; busy = 1; drawG(); try { const r = await fq('/api/active-weapon', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ index: i }) }); if (!r.ok) throw 0; aw = i; if (ws?.readyState !== 1) await stat(); } catch (_) { msg('Weapon switch failed', 0); } finally { busy = 0; drawG(); } }
const stat = () => fq('/api/ping').then((r) => r.ok ? fq('/api/status') : Promise.reject()).then((r) => r.ok ? r.json() : Promise.reject()).then((j) => { setS(j); conn(1, 'HTTP'); });
const load = () => fq('/api/profile').then((r) => r.ok ? r.text() : Promise.reject()).then((t) => { loaded = 1; const p = parse(t); ed.setValue(p.ok ? pretty(p.raw) : t, -1); if (p.ok) setP(p.raw); }).catch(() => msg('Load failed', 0));
const boot = () => { conn(0, 'Loading…'); wsOn(); return stat().catch(() => conn(0, 'Offline')).then(load).then(() => msg('')); };
$('btn-toggle').onclick = () => fq('/api/toggle-macros', { method: 'POST' }).then((r) => (r.ok && ws?.readyState !== 1 ? stat() : r.ok || Promise.reject())).catch(() => msg('Toggle failed', 0));
$('btn-reload').onclick = boot;
$('btn-upload').onclick = async () => { const text = ed.getValue(); const p = parse(text); if (!p.ok) return msg(p.e, 0); const body = minify(p.raw); if (body.length > maxB) return msg(`Minified ${body.length} B exceeds max ${maxB} B`, 0); const saved = text.length - body.length; msg(`Uploading ${body.length} B${saved > 0 ? ` (−${saved} B vs editor)` : ''}…`); try { const r = await fq('/api/profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }); if (!r.ok) throw new Error(await err(r, 'Upload failed')); setP(p.raw); await boot(); msg(`Uploaded ${body.length} B minified`, 1); } catch (e) { msg(e.message, 0); } };
setTimeout(boot, 400);
</script>
</body>
</html>
