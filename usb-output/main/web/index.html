<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macro</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/ace.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/mode-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/theme/tomorrow_night.min.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 antialiased min-h-screen">
<main class="max-w-2xl mx-auto p-4 space-y-4">
  <header class="flex items-center justify-between gap-2">
    <h1 class="text-lg font-semibold">MacroPassthrough</h1>
    <a href="/docs/profile-schema" class="text-sm text-blue-400 hover:underline">Schema docs</a>
  </header>

  <div class="flex flex-wrap gap-2">
    <button type="button" id="btn-toggle" class="px-4 py-2 rounded-md text-sm font-medium text-white bg-zinc-600">Macros OFF</button>
    <button type="button" id="btn-reload" class="px-4 py-2 rounded-md text-sm bg-zinc-700 hover:bg-zinc-600">Reload</button>
    <button type="button" id="btn-upload" class="px-4 py-2 rounded-md text-sm bg-blue-600 hover:bg-blue-500 text-white">Upload</button>
  </div>

  <section class="text-sm space-y-1 border border-zinc-700 rounded-lg p-3 bg-zinc-800/50">
    <p><span class="text-zinc-500">Macro:</span> <span id="v-profile" class="font-medium">—</span></p>
    <p><span class="text-zinc-500">Gun:</span> <span id="v-gun" class="font-medium">—</span></p>
    <p><span class="text-zinc-500">Script:</span> <span id="v-script" class="font-medium">—</span></p>
    <p><span class="text-zinc-500">Status:</span> <span id="v-status">—</span></p>
    <p id="v-conn" class="text-xs text-zinc-500 pt-1">Connecting…</p>
  </section>

  <div id="profile-json" class="w-full h-72 rounded-md border border-zinc-700 overflow-hidden"></div>
  <p id="msg" class="text-xs text-zinc-500"></p>
</main>
<script>
(function () {
  var q = Promise.resolve();
  var ws = null, wsRetry = null, profileLoaded = false;
  var editor = ace.edit('profile-json');
  editor.setTheme('ace/theme/tomorrow_night');
  editor.session.setMode('ace/mode/json');
  editor.session.setUseWorker(false);
  editor.setOptions({ fontSize: 12, showPrintMargin: false, tabSize: 2, useSoftTabs: true });
  function $(id) { return document.getElementById(id); }
  function pad(n) { return '  '.repeat(n); }
  function formatValue(val, indent) {
    if (val === null) return 'null';
    if (typeof val !== 'object') return JSON.stringify(val);
    if (Array.isArray(val)) {
      if (!val.length) return '[]';
      return '[\n' + val.map(function (item) {
        return pad(indent + 1) + formatValue(item, indent + 1);
      }).join(',\n') + '\n' + pad(indent) + ']';
    }
    var keys = Object.keys(val);
    if (!keys.length) return '{}';
    var lines = keys.map(function (k) {
      var v = val[k];
      if (k === 'steps' && Array.isArray(v)) {
        var steps = v.map(function (s) { return pad(indent + 1) + JSON.stringify(s); });
        return pad(indent + 1) + '"steps": [\n' + steps.join(',\n') + '\n' + pad(indent + 1) + ']';
      }
      return pad(indent + 1) + JSON.stringify(k) + ': ' + formatValue(v, indent + 1);
    });
    return '{\n' + lines.join(',\n') + '\n' + pad(indent) + '}';
  }
  function setJson(t) {
    try { editor.setValue(formatValue(JSON.parse(t), 0), -1); }
    catch (e) { editor.setValue(t, -1); }
  }
  function getJson() { return editor.getValue(); }
  /* Serialize HTTP; never abort the previous request (aborted TCP leaks lwIP sockets on ESP32). */
  function fetchQ(url, opts) {
    opts = opts || {};
    var p = q.then(function () {
      var ac = new AbortController();
      var t = setTimeout(function () { ac.abort(); }, 12000);
      var init = { cache: 'no-store', signal: ac.signal };
      if (opts.method) init.method = opts.method;
      if (opts.body != null) init.body = opts.body;
      if (opts.headers) init.headers = opts.headers;
      return fetch(url, init).finally(function () { clearTimeout(t); });
    });
    q = p.catch(function () {});
    return p;
  }
  function connectWs() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try { ws = new WebSocket(proto + '//' + location.host + '/ws'); } catch (e) { return; }
    ws.onopen = function () {
      setConn(true, 'Live (WebSocket)');
    };
    ws.onmessage = function (ev) {
      try {
        applyStatus(JSON.parse(ev.data));
        setConn(true, 'Live (WebSocket)');
      } catch (e) {}
    };
    ws.onclose = function () {
      ws = null;
      if (!wsRetry) {
        wsRetry = setTimeout(function () { wsRetry = null; connectWs(); }, 3000);
      }
      if (!profileLoaded) return;
      setConn(false, 'WS offline — use Reload');
    };
    ws.onerror = function () {};
  }
  function setToggle(on) {
    var b = $('btn-toggle');
    b.textContent = on ? 'Macros ON' : 'Macros OFF';
    b.className = on
      ? 'px-4 py-2 rounded-md text-sm font-medium text-white bg-green-600 hover:bg-green-500'
      : 'px-4 py-2 rounded-md text-sm font-medium text-white bg-zinc-600 hover:bg-zinc-500';
    var s = $('v-status');
    s.textContent = on ? 'Macros enabled' : 'Macros disabled';
    s.className = on ? 'text-green-400 font-medium' : 'text-red-400 font-medium';
  }
  function applyStatus(j) {
    $('v-profile').textContent = j.profile || '—';
    $('v-gun').textContent = j.activeWeaponName || '—';
    $('v-script').textContent = j.activeScriptName || '—';
    setToggle(!!j.macrosOn);
  }
  function setConn(ok, txt) {
    $('v-conn').textContent = txt;
    $('v-conn').className = ok ? 'text-xs text-green-400 pt-1' : 'text-xs text-amber-400 pt-1';
  }
  function setMsg(txt, ok) {
    $('msg').textContent = txt || '';
    $('msg').className = ok ? 'text-xs text-green-400' : (txt ? 'text-xs text-amber-400' : 'text-xs text-zinc-500');
  }
  function refreshStatusHttp() {
    return fetchQ('/api/ping')
      .then(function (r) { if (!r.ok) throw 0; return fetchQ('/api/status'); })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { applyStatus(j); setConn(true, 'Connected (HTTP)'); });
  }
  function loadProfile() {
    return fetchQ('/api/profile')
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (t) { profileLoaded = true; setJson(t); })
      .catch(function () { setMsg('Could not load profile JSON.', false); });
  }
  function boot() {
    setConn(false, 'Loading…');
    connectWs();
    return refreshStatusHttp()
      .catch(function () { setConn(false, 'Offline — use Reload'); })
      .then(loadProfile)
      .then(function () { setMsg('', false); });
  }
  $('btn-toggle').onclick = function () {
    fetchQ('/api/toggle-macros', { method: 'POST' })
      .then(function (r) {
        if (!r.ok) throw 0;
        if (!ws || ws.readyState !== WebSocket.OPEN) return refreshStatusHttp();
      })
      .catch(function () { setMsg('Toggle failed.', false); });
  };
  $('btn-reload').onclick = boot;
  $('btn-upload').onclick = function () {
    var t = getJson();
    try { JSON.parse(t); } catch (e) { setMsg('Invalid JSON.', false); return; }
    setMsg('Uploading…', false);
    fetchQ('/api/profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: t })
      .then(function (r) { if (!r.ok) throw 0; return boot(); })
      .then(function () { setMsg('Uploaded.', true); })
      .catch(function () { setMsg('Upload failed.', false); });
  };
  setTimeout(boot, 400);
})();
</script>
</body>
</html>
