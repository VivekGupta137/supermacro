<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macro</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/ace.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/mode-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/theme/tomorrow_night.min.js"></script>
<script type="importmap">{"imports":{"zod":"https://cdn.jsdelivr.net/npm/zod@3.23.8/+esm"}}</script>
</head>
<body class="bg-zinc-900 text-zinc-100 antialiased min-h-screen">
<main class="max-w-2xl mx-auto p-4 space-y-4">
  <header class="flex justify-between gap-2"><h1 class="text-lg font-semibold">MacroPassthrough</h1><a href="/docs/profile-schema" class="text-sm text-blue-400 hover:underline">Schema</a></header>
  <div class="flex flex-wrap gap-2">
    <button type="button" id="btn-toggle" class="px-4 py-2 rounded-md text-sm font-medium bg-zinc-600">Macros OFF</button>
    <button type="button" id="btn-reload" class="px-4 py-2 rounded-md text-sm bg-zinc-700 hover:bg-zinc-600">Reload</button>
    <button type="button" id="btn-upload" class="px-4 py-2 rounded-md text-sm bg-blue-600 hover:bg-blue-500 text-white">Upload</button>
  </div>
  <section id="weapons-section" class="hidden space-y-2"><p class="text-sm text-zinc-500">Weapons</p><div id="weapon-bar" class="flex flex-wrap gap-2"></div></section>
  <section id="presets-section" class="hidden space-y-2"><p class="text-sm text-zinc-500">Recoil scripts (browser)</p><div id="preset-bar" class="flex flex-wrap gap-2"></div></section>
  <section class="text-sm space-y-1 border border-zinc-700 rounded-lg p-3 bg-zinc-800/50">
    <p><span class="text-zinc-500">Macro:</span> <span id="v-profile" class="font-medium">—</span></p>
    <p><span class="text-zinc-500">Gun:</span> <span id="v-gun" class="font-medium">—</span></p>
    <p><span class="text-zinc-500">Status:</span> <span id="v-status">—</span></p>
    <p id="v-conn" class="text-xs text-zinc-500 pt-1">Connecting…</p>
  </section>
  <div id="profile-json" class="w-full h-72 rounded-md border border-zinc-700 overflow-hidden"></div>
  <button type="button" id="btn-lsave" class="px-4 py-2 rounded-md text-sm bg-zinc-700 hover:bg-zinc-600">Local save</button>
  <p id="msg" class="text-xs text-zinc-500"></p>
</main>
<script type="module">
import { z } from 'zod';
const L = { M: 10, S: 100, B: 131072 }, $ = (id) => document.getElementById(id);
const bad = new Set(['mouseTo', 'interp', 'segments', 'humanize']);
const step = z.object({ us: z.number().nonnegative(), mouse: z.record(z.unknown()).optional(), kbd: z.record(z.unknown()).optional() }).passthrough()
  .refine((s) => !Object.keys(s).some((k) => bad.has(k)), { message: 'removed step field' });
const mode = z.object({ comment: z.string().optional(), name: z.string().optional(), steps: z.array(step).min(1).max(L.S), n: z.number().int().positive().max(L.S).optional(), press: z.record(z.unknown()).optional(), loop: z.boolean().optional(), pressMode: z.enum(['chord', 'exact']).optional(), triggerMode: z.enum(['hold', 'tap']).optional(), modeScale: z.number().positive().optional(), scale: z.number().positive().optional() }).passthrough()
  .superRefine((m, c) => { const n = m.n ?? m.steps.length; if (n > m.steps.length) c.addIssue({ code: 'custom', message: `n=${n} > ${m.steps.length}`, path: ['n'] }); });
const bank = z.object({ name: z.string().optional(), modes: z.array(mode).max(L.M).optional(), groups: z.array(mode).max(L.M).optional() }).passthrough()
  .superRefine((w, c) => { if (!(w.modes ?? w.groups)?.length) c.addIssue({ code: 'custom', message: 'modes/groups required' }); });
const schema = z.object({ v: z.union([z.literal(1), z.literal(2), z.literal(3)]), name: z.string().optional(), groups: z.array(mode).min(1).max(L.M).optional(), scripts: z.array(bank).min(1).optional(), weapons: z.array(bank).min(1).optional(), activeScript: z.number().int().nonnegative().optional(), activeWeapon: z.number().int().nonnegative().optional() }).passthrough()
  .superRefine((p, c) => { if (p.v === 1) { if (!p.groups?.length) c.addIssue({ code: 'custom', message: 'v1 needs groups[]' }); return; } if (!((p.weapons ?? p.scripts)?.length)) c.addIssue({ code: 'custom', message: 'weapons/scripts required' }); });
const parse = (t) => { let raw; try { raw = JSON.parse(t); } catch (e) { return { ok: 0, e: e.message }; } const r = schema.safeParse(raw); return r.success ? { ok: 1, d: r.data, raw } : { ok: 0, e: r.error.issues.map((i) => (i.path.length ? i.path.join('.') + ': ' : '') + i.message).join('; ') }; };
const minify = (d) => JSON.stringify(d);
const pad = (n) => '  '.repeat(n);
const pretty = (v, i = 0) => {
  if (v === null) return 'null';
  if (typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return v.length ? '[\n' + v.map((x) => pad(i + 1) + pretty(x, i + 1)).join(',\n') + '\n' + pad(i) + ']' : '[]';
  const ks = Object.keys(v).sort((a, b) => (a === 'comment' ? -1 : b === 'comment' ? 1 : 0));
  if (!ks.length) return '{}';
  return '{\n' + ks.map((k) => {
    const val = v[k];
    if (k === 'steps' && Array.isArray(val)) {
      return pad(i + 1) + '"steps": [\n' + val.map((s) => pad(i + 1) + JSON.stringify(s)).join(',\n') + '\n' + pad(i + 1) + ']';
    }
    return pad(i + 1) + JSON.stringify(k) + ': ' + pretty(val, i + 1);
  }).join(',\n') + '\n' + pad(i) + '}';
};
const guns = (p) => p.v !== 1 ? (p.weapons ?? p.scripts ?? []).map((w, i) => ({ i, n: w.name || `w${i}` })) : [{ i: 0, n: p.name || 'profile' }];
const LS = 'macro_presets', btn = 'px-3 py-1.5 rounded-md text-sm font-medium disabled:opacity-60';
const presets = () => { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } };
let q = Promise.resolve(), ws, wsT, pollT, loaded, busy, W = [], aw = 0, maxB = L.B, actGun = '', actMacro = '', wsDelay = 8000, wsAt = 0, wsTryAt = 0;
const norm = (s) => String(s ?? '').trim().toLowerCase();
const presetMatchesActive = (key, rawText, macro) => {
  const a = norm(macro);
  if (!a) return false;
  if (norm(key) === a) return true;
  const p = parse(rawText);
  return p.ok && p.raw.name && norm(p.raw.name) === a;
};
const WS_MIN_MS = 7000;
const wsOpen = () => ws?.readyState === 1;
const wsOpening = () => ws && (ws.readyState === 0 || ws.readyState === 1);
const ed = ace.edit('profile-json'); ed.setTheme('ace/theme/tomorrow_night'); ed.session.setMode('ace/mode/json'); ed.session.setUseWorker(false); ed.setOptions({ fontSize: 12, showPrintMargin: false, tabSize: 2, useSoftTabs: true });
const msg = (t, ok) => { $('msg').textContent = t || ''; $('msg').className = ok ? 'text-xs text-green-400' : t ? 'text-xs text-amber-400' : 'text-xs text-zinc-500'; };
const fq = (u, o = {}) => { const p = q.then(async () => { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 12000); try { return await fetch(u, { cache: 'no-store', signal: ac.signal, ...o }); } finally { clearTimeout(tm); } }); q = p.catch(() => {}); return p; };
const err = async (r, fb) => { try { const j = await r.json(); if (j.error) return j.error; } catch (_) {} return fb; };
const conn = (ok, t) => { $('v-conn').textContent = t; $('v-conn').className = (ok ? 'text-green-400' : 'text-amber-400') + ' text-xs pt-1'; };
const drawG = () => { const b = $('weapon-bar'), on = btn + ' text-white bg-green-600 hover:bg-green-500', off = btn + ' text-zinc-200 bg-zinc-700 hover:bg-zinc-600'; b.replaceChildren(); $('weapons-section').classList.toggle('hidden', W.length <= 1); W.forEach((w) => { const e = document.createElement('button'); e.type = 'button'; e.textContent = w.n; e.disabled = busy; e.className = w.i === aw ? on : off; e.onclick = () => pick(w.i); b.appendChild(e); }); };
const drawP = () => {
  const b = $('preset-bar'), keys = Object.keys(presets()).sort();
  const on = btn + ' text-white bg-green-600 hover:bg-green-500';
  const off = btn + ' text-zinc-200 bg-zinc-700 hover:bg-zinc-600';
  $('presets-section').classList.toggle('hidden', !keys.length);
  b.replaceChildren();
  keys.forEach((k) => {
    const t = presets()[k];
    const e = document.createElement('button');
    e.type = 'button';
    e.textContent = k;
    e.disabled = busy;
    e.className = presetMatchesActive(k, t, actMacro) ? on : off;
    e.onclick = () => useP(k);
    b.appendChild(e);
  });
};
const setP = (p) => { W = guns(p); drawG(); };
const setS = (j) => {
  actMacro = (j.profile || '').trim();
  $('v-profile').textContent = actMacro || '—';
  actGun = (j.activeWeaponName || j.activeScriptName || '').trim();
  $('v-gun').textContent = actGun || '—';
  if (typeof j.activeWeapon === 'number') aw = j.activeWeapon;
  else if (typeof j.activeScript === 'number') aw = j.activeScript;
  if (j.profileMaxBytes > 0) maxB = j.profileMaxBytes;
  const ns = j.weaponNames || j.scriptNames;
  if (ns?.length) W = ns.map((n, i) => ({ i, n: n || `w${i}` }));
  if (W.length && aw >= W.length) aw = 0;
  drawG();
  drawP();
  const on = !!j.macrosOn;
  $('btn-toggle').textContent = on ? 'Macros ON' : 'Macros OFF';
  $('btn-toggle').className = `px-4 py-2 rounded-md text-sm font-medium text-white ${on ? 'bg-green-600 hover:bg-green-500' : 'bg-zinc-600 hover:bg-zinc-500'}`;
  $('v-status').textContent = on ? 'Macros enabled' : 'Macros disabled';
  $('v-status').className = on ? 'text-green-400 font-medium' : 'text-red-400 font-medium';
};
const pollOn = () => { clearInterval(pollT); pollT = setInterval(() => { if (!wsOpen()) stat().catch(() => {}); }, 30000); };
const pollOff = () => { clearInterval(pollT); pollT = null; };
const resetDev = () => fq('/api/conn-reset', { method: 'POST' }).catch(() => {});
const wsOff = () => { if (!ws) return; const s = ws; ws = null; s.onclose = null; s.onerror = null; try { s.close(); } catch (_) {} };
const wsSched = (ms) => {
  if (wsOpening()) return;
  clearTimeout(wsT);
  const wait = Math.max(ms ?? wsDelay, WS_MIN_MS);
  const since = Date.now() - Math.max(wsAt, wsTryAt);
  const left = Math.max(wait - since, 0);
  wsT = setTimeout(() => { wsT = null; wsOn(); }, left);
};
const wsOn = () => {
  if (wsOpening()) return;
  const since = Date.now() - Math.max(wsAt, wsTryAt);
  if (since < WS_MIN_MS) { wsSched(WS_MIN_MS - since); return; }
  pollOff();
  wsTryAt = Date.now();
  const s = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`);
  ws = s;
  s.onopen = () => { wsAt = Date.now(); wsDelay = 8000; pollOff(); conn(1, 'Live (WebSocket)'); };
  s.onmessage = (ev) => { try { setS(JSON.parse(ev.data)); conn(1, 'Live (WebSocket)'); } catch (_) {} };
  s.onerror = () => { if (ws === s) ws = null; };
  s.onclose = () => {
    if (ws === s) ws = null;
    if (!loaded) return;
    conn(0, 'WS offline — reconnecting…');
    if (wsDelay >= 30000) pollOn();
    wsSched(wsDelay);
    wsDelay = Math.min(wsDelay * 2, 60000);
  };
};
const stat = () => fq('/api/status').then((r) => r.ok ? r.json() : Promise.reject()).then((j) => { setS(j); conn(1, wsOpen() ? 'Live (WebSocket)' : 'HTTP'); });
const load = () => fq('/api/profile').then((r) => { if (r.status === 404) return '{}'; if (!r.ok) return Promise.reject(); return r.text(); }).then((t) => { loaded = 1; const p = parse(t); ed.setValue(p.ok ? pretty(p.raw) : (t || '{}'), -1); if (p.ok) setP(p.raw); });
async function pick(i) { if (busy || i === aw) return; busy = 1; drawG(); drawP(); try { const r = await fq('/api/active-weapon', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ index: i }) }); if (!r.ok) throw 0; aw = i; if (!wsOpen()) await stat(); } catch (_) { msg('Weapon switch failed', 0); } finally { busy = 0; drawG(); drawP(); } }
async function up(text) { const p = parse(text); if (!p.ok) return msg(p.e, 0); const body = minify(p.raw); if (body.length > maxB) return msg(`Minified ${body.length} B exceeds max ${maxB} B`, 0); msg(`Uploading ${body.length} B…`); const r = await fq('/api/profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }); if (!r.ok) throw new Error(await err(r, 'Upload failed')); setP(p.raw); await stat(); msg(`Uploaded ${body.length} B`, 1); }
async function useP(k) { const t = presets()[k]; if (!t || busy) return; busy = 1; drawP(); drawG(); try { const p = parse(t); ed.setValue(p.ok ? pretty(p.raw) : t, -1); await up(t); } catch (e) { msg(e.message || 'Upload failed', 0); } finally { busy = 0; drawP(); drawG(); } }
const boot = async (opts = {}) => {
  conn(0, 'Loading…');
  wsOff();
  clearTimeout(wsT);
  wsT = null;
  wsDelay = 3000;
  try {
    if (opts.reset) await resetDev();
    await load();
    await stat();
    drawP();
    wsSched(1500);
    msg('');
  } catch (_) {
    conn(0, 'Offline — check IP / reload');
    msg('Could not load profile or status from device', 0);
  }
};
$('btn-toggle').onclick = () => fq('/api/toggle-macros', { method: 'POST' }).then((r) => (r.ok && !wsOpen() ? stat() : r.ok || Promise.reject())).catch(() => msg('Toggle failed', 0));
$('btn-reload').onclick = () => boot({ reset: 1 });
$('btn-upload').onclick = async () => { try { await up(ed.getValue()); } catch (e) { msg(e.message, 0); } };
$('btn-lsave').onclick = () => {
  const t = ed.getValue();
  const p = parse(t);
  if (!p.ok) return msg(p.e, 0);
  const n = String(p.raw.name ?? '').trim();
  if (!n) return msg('Add a top-level "name" in the JSON to use as the preset key', 0);
  const o = presets();
  if (Object.prototype.hasOwnProperty.call(o, n) && !confirm(`Overwrite local preset "${n}"?`)) return;
  o[n] = t;
  localStorage.setItem(LS, JSON.stringify(o));
  drawP();
  msg(`Saved "${n}" in browser`, 1);
};
/* Alt+tab: never open a second socket — onclose alone schedules reconnect. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !loaded) return;
  if (wsOpen()) conn(1, 'Live (WebSocket)');
});
setTimeout(boot, 400);
</script>
</body>
</html>
